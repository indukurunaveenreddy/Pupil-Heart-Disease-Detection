<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pupil Heart Disease Identification - Result</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f4f7fc; }

        .navbar { background: linear-gradient(90deg, #0f2027, #203a43, #2c5364); }
        .navbar-brand { font-weight: 700; color: #fff !important; }
        .nav-link { color: #fff !important; margin-left: 15px; }
        .nav-link:hover { color: #00d4ff !important; }

        .hero { background: url('static/img/hero-slider/g2.jpg') center/cover no-repeat; min-height: 100vh; display: flex; align-items: center; }
        .overlay { background: rgba(0,0,0,0.65); width: 100%; padding: 60px 0; }

        .result-card {
            background: #fff;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .result-img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin: 20px 0;
        }

        .btn-custom {
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
        }

        .btn-custom:hover { background: #0072ff; }

        footer { background: #0f2027; color: white; padding: 15px; text-align: center; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Pupil Heart AI</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('userhome') }}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('upload1') }}">Upload Image</a></li>
                <li class="nav-item"><a class="nav-link text-info" href="{{ url_for('live') }}"><i class="fas fa-video me-1"></i>Live Stream</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Result Section -->
<section class="hero">
    <div class="overlay">
        <div class="container">
            <div class="row justify-content-center">

                <div class="col-lg-6">
                    <div class="result-card">
                        <h3 class="fw-bold text-success">Uploaded Image</h3>

                        <img src="{{ url_for('send_image', filename=image_name) }}" class="result-img" alt="Uploaded Image">

                        {% if text %}
                        <h5 class="mt-3">Prediction: {{ text }}</h5>
                        {% endif %}

                        {% if a %}
                        <p>Accuracy: {{ a }}%</p>
                        {% endif %}

                        <a href="{{ url_for('upload1') }}" class="btn btn-custom mt-3">Predict Another Image</a>
                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Pupil Heart Disease Identification</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
