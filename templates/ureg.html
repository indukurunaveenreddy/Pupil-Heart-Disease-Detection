<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pupil Heart Disease Identification - Registration</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f7fc;
        }

        .navbar {
            background: linear-gradient(90deg, #0f2027, #203a43, #2c5364);
        }

        .navbar-brand {
            font-weight: 700;
            color: #fff !important;
        }

        .nav-link {
            color: #fff !important;
            margin-left: 15px;
        }

        .nav-link:hover {
            color: #00d4ff !important;
        }

        .hero {
            background: url('static/img/hero-slider/g2.jpg') center/cover no-repeat;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .overlay {
            background: rgba(0,0,0,0.6);
            width: 100%;
            padding: 50px 0;
        }

        .form-card {
            background: #fff;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .form-control, .form-select {
            border-radius: 10px;
        }

        .btn-custom {
            background: #00c6ff;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
        }

        .btn-custom:hover {
            background: #0072ff;
        }

        footer {
            background: #0f2027;
            color: white;
            padding: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Pupil Heart AI</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="{{ url_for('user') }}">User</a></li>
                
            </ul>
        </div>
    </div>
</nav>

<!-- Hero Section with Form -->
<section class="hero">
    <div class="overlay">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-lg-6 text-white">
                    <h2 class="fw-bold">User Registration</h2>
                    <p>Register to access AI-based pupil heart disease prediction system.</p>
                </div>

                <div class="col-lg-6">
                    <div class="form-card">

                        {% if msg=="Login Failure!!!" %}
                        <div class="alert alert-danger">Invalid Username or Password</div>
                        {% endif %}

                        <form action="{{url_for('uregback')}}" method="POST">
                            <div class="mb-3">
                                <input type="text" name="name" class="form-control" placeholder="Full Name" required>
                            </div>

                            <div class="mb-3">
                                <input type="email" name="email" class="form-control" placeholder="Email" required>
                            </div>

                            <div class="mb-3">
                                <input type="password" name="pass" class="form-control" placeholder="Password" required>
                            </div>

                            <div class="mb-3">
                                <input type="date" name="dob" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <input type="text" name="addr" class="form-control" placeholder="Address" required>
                            </div>

                            <div class="mb-3">
                                <input type="text" name="ph" class="form-control" placeholder="Mobile Number" required>
                            </div>

                            <div class="mb-3">
                                <select name="gender" class="form-select" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-custom">Register</button>
                            </div>
                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</section>

<footer>
    <p>© 2026 Pupil Heart Disease Identification</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
